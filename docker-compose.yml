
# ============================================================
# TALLER 3 - MINI-LAKEHOUSE
#
# PostgreSQL: fuente transaccional de la maraton.
# Python: ETL/ELT, Parquet, DuckDB y consultas analiticas.
# pgAdmin 4: administracion visual de PostgreSQL.
#
# Simplificacion del Taller 2:
# No utilizamos Kafka, Redis ni ClickHouse en esta demo.
# ============================================================

services:

  # ----------------------------------------------------------
  # FUENTE OPERACIONAL - PostgreSQL
  # ----------------------------------------------------------
  db:
    image: postgres:16
    container_name: maraton-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: maraton
      POSTGRES_USER: maraton
      POSTGRES_PASSWORD: lakehouse_local_dev

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maraton -d maraton"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # ADMINISTRACION VISUAL - pgAdmin 4
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: maraton-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@maraton.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------
  # PIPELINE ANALITICO - Python + DuckDB
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: maraton-lakehouse

    working_dir: /app

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: maraton
      DB_USER: maraton
      DB_PASSWORD: lakehouse_local_dev

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy

    command: ["sleep", "infinity"]

# Persistencia de PostgreSQL y pgAdmin entre ejecuciones.
volumes:
  postgres_data:
  pgadmin_data:
